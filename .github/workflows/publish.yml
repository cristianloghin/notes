# Publishes to npm via Trusted Publishing (OIDC): no npm token is stored in
# the repo. The npm side is configured for this repository and this workflow
# file name, so renaming the file breaks the trust relationship.
#
# Release flow: bump "version" in package.json and land it on main (through a
# pull request like any other change). Every push to main publishes the
# version in package.json if the registry does not have it yet, and tags
# that commit vX.Y.Z; a push that leaves the version alone publishes
# nothing. prepublishOnly runs typecheck, tests and the build.
name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write # to push the version tag
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Is this version on the registry already?
        id: version
        run: |
          pkg="$(npm pkg get version | tr -d '"')"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if npm view "@mikrostack/notes@$pkg" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@mikrostack/notes@$pkg is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.published == 'false'
        run: npm publish --access public

      - if: steps.version.outputs.published == 'false'
        name: Tag the published commit
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
